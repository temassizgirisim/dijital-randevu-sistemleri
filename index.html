<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liva Güzellik & Tırnak | Temassız Randevu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: {
                            300: '#fde047',
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                            700: '#a16207',
                            DEFAULT: '#D4AF37',
                            light: '#F3E5AB',
                            dark: '#AA7C11'
                        },
                        darkBg: '#0a0a0a',
                        cardBg: '#141414',
                        borderGold: '#332900'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF 0%, #D4AF37 50%, #AA7C11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-border {
            border-color: rgba(212, 175, 55, 0.3);
        }
        .gold-border:focus {
            border-color: #D4AF37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
    </style>
</head>
<body class="bg-darkBg text-zinc-100 min-h-screen flex flex-col justify-between selection:bg-gold-600 selection:text-black">

    <!-- Header / İşletme Bilgisi -->
    <header class="w-full max-w-md mx-auto pt-8 px-4 text-center">
        <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-gold-700 via-gold-500 to-gold-300 mx-auto flex items-center justify-center text-black font-extrabold text-2xl shadow-xl shadow-gold-500/20 mb-4 border border-gold/40">
            LG
        </div>
        <h1 class="text-2xl font-extrabold text-zinc-100 tracking-wide">Liva Güzellik & Tırnak</h1>
        <p class="text-xs text-gold-400 mt-1 flex items-center justify-center">
            <i class="fa-solid fa-location-dot mr-1"></i> Kadıköy, İstanbul
        </p>
    </header>

    <!-- Ana Randevu Kartı -->
    <main class="w-full max-w-md mx-auto p-4 my-6">
        <div class="bg-cardBg border border-gold/30 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-gold-500/10 rounded-full blur-2xl"></div>

            <h2 class="text-sm font-bold text-zinc-300 uppercase tracking-wider mb-4 border-b border-borderGold pb-2">
                <i class="fa-solid fa-calendar-days text-gold-500 mr-2"></i>Randevu Oluştur
            </h2>

            <form id="bookingForm" onsubmit="handleBooking(event)" class="space-y-4">
                <!-- Hizmet Seçimi -->
                <div>
                    <label class="block text-xs font-semibold text-gold-400 mb-1 uppercase tracking-wider">Hizmet Seçin</label>
                    <select id="serviceSelect" class="w-full bg-darkBg border border-gold/30 rounded-xl px-4 py-3 text-sm text-zinc-200 focus:outline-none gold-border">
                        <option value="Jel Tırnak Uygulaması (850 TL)">Jel Tırnak Uygulaması (60 dk) — 850 TL</option>
                        <option value="Cilt Bakımı & Hydrafacial (1.200 TL)">Cilt Bakımı & Hydrafacial (45 dk) — 1.200 TL</option>
                        <option value="İpek Kirpik (950 TL)">İpek Kirpik (75 dk) — 950 TL</option>
                        <option value="Manikür & Pedikür (500 TL)">Manikür & Pedikür (45 dk) — 500 TL</option>
                    </select>
                </div>

                <!-- Gün ve Saat -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gold-400 mb-1 uppercase tracking-wider">Gün</label>
                        <select id="daySelect" class="w-full bg-darkBg border border-gold/30 rounded-xl px-3 py-3 text-sm text-zinc-200 focus:outline-none gold-border">
                            <option>Bugün</option>
                            <option>Yarın</option>
                            <option>Cumartesi</option>
                            <option>Pazar</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gold-400 mb-1 uppercase tracking-wider">Saat</label>
                        <select id="timeSelect" class="w-full bg-darkBg border border-gold/30 rounded-xl px-3 py-3 text-sm text-zinc-200 focus:outline-none gold-border">
                            <option>10:00</option>
                            <option>11:30</option>
                            <option>13:30</option>
                            <option>15:00</option>
                            <option>16:30</option>
                            <option>18:00</option>
                        </select>
                    </div>
                </div>

                <!-- Müşteri Bilgileri -->
                <div>
                    <label class="block text-xs font-semibold text-gold-400 mb-1 uppercase tracking-wider">Adınız Soyadınız</label>
                    <input type="text" id="clientName" required placeholder="Örn: Zilan Üstündağ" class="w-full bg-darkBg border border-gold/30 rounded-xl px-4 py-3 text-sm text-zinc-200 focus:outline-none gold-border">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gold-400 mb-1 uppercase tracking-wider">Telefon Numaranız</label>
                    <input type="tel" id="clientPhone" required placeholder="05XX XXX XX XX" class="w-full bg-darkBg border border-gold/30 rounded-xl px-4 py-3 text-sm text-zinc-200 focus:outline-none gold-border">
                </div>

                <!-- Onay Butonu -->
                <button type="submit" class="w-full py-4 rounded-xl bg-gradient-to-r from-gold-600 via-gold-500 to-gold-300 text-black font-extrabold text-sm tracking-wide uppercase hover:opacity-95 shadow-lg shadow-gold-500/20 transition-all mt-2">
                    Randevuyu Onayla
                </button>
            </form>
        </div>
    </main>

    <!-- Başarılı Randevu Modal (Gizli) -->
    <div id="successModal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardBg border border-gold/40 rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl">
            <div class="w-16 h-16 rounded-full bg-gold-500/20 border border-gold/50 flex items-center justify-center text-gold-400 text-2xl mx-auto mb-4">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 class="text-xl font-bold text-zinc-100 mb-2">Randevunuz Alındı!</h3>
            <p class="text-xs text-zinc-400 mb-6 leading-relaxed">
                Seçtiğiniz saat rezerve edildi. İşletme sahibi randevunuzu onaylamak için sizinle iletişime geçecektir.
            </p>
            <button onclick="closeModal()" class="w-full py-3 rounded-xl bg-gold-500 text-black font-bold hover:bg-gold-400 transition-all text-sm">
                Tamam
            </button>
        </div>
    </div>

    <!-- Footer / Marka İmzası -->
    <footer class="w-full py-6 text-center text-[11px] text-zinc-500 border-t border-borderGold">
        <p>Altyapı <span class="text-gold-500 font-bold">Temassız Randevu</span> ile hazırlanmıştır.</p>
        <p class="text-zinc-600 mt-0.5">Bir <strong class="text-zinc-400">Temassız Girişim</strong> Ürünüdür.</p>
    </footer>

    <script>
        function handleBooking(event) {
            event.preventDefault();
            
            const service = document.getElementById('serviceSelect').value;
            const day = document.getElementById('daySelect').value;
            const time = document.getElementById('timeSelect').value;
            const name = document.getElementById('clientName').value;
            const phone = document.getElementById('clientPhone').value;

            // İstersen burada randevu bilgilerini WhatsApp üzerinden dükkan sahibine iletmek için şu kodu açabilirsin:
            // const msg = `Yeni Randevu Talebi!%0AAd: ${name}%0ATel: ${phone}%0AHizmet: ${service}%0AZaman: ${day} Saat ${time}`;
            // window.open(`https://wa.me/905427474579?text=${msg}`, '_blank');

            document.getElementById('successModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('successModal').classList.add('hidden');
            document.getElementById('bookingForm').reset();
        }
    </script>
</body>
</html>
